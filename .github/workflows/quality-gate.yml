name: Quality Gate

on:
  push:
    branches:
      - main
      - development/v2-finalization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg

jobs:
  application:
    name: Application and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate with Git LFS
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-notebook.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app.py tests

      - name: Run data, metric, documentation, and hygiene tests
        run: python -m pytest -m "not streamlit and not notebook"

      - name: Run Streamlit five-section smoke test
        run: python -m pytest -m streamlit

  notebook:
    name: Notebook execution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate with Git LFS
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-notebook.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Execute all notebook cells
        run: python -m pytest -m notebook

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out dependency manifests
        uses: actions/checkout@v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-notebook.txt
            requirements-dev.txt

      - name: Audit pinned dependency tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-dev.txt
